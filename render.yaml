# Render Blueprint for OpenCode (headless agent server)
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# If your dashboard rejects `runtime`, replace it with `env: docker`.

services:
  - type: web
    name: opencode
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true

    # Sessions, config, credentials and the cloned repo live here.
    # Persistent disks require a paid instance type (Starter or above).
    disk:
      name: opencode-data
      mountPath: /data
      sizeGB: 10

    envVars:
      # --- required -------------------------------------------------
      - key: OPENCODE_PASSWORD          # web UI / TUI login password
        sync: false
      # --- optional: repo the agent should work on ------------------
      - key: REPO_URL                   # https://github.com/you/your-repo.git
        sync: false
      - key: GITHUB_TOKEN               # for private repos + pushing commits
        sync: false
      - key: GIT_AUTHOR_NAME
        value: OpenCode Agent
      - key: GIT_AUTHOR_EMAIL
        sync: false
      # --- model providers (set the ones you use) -------------------
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
